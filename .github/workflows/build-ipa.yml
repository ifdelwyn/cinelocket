name: Build CineLocket iOS IPA (120Hz Mobile Optimized)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets to iOS Native App
        run: |
          echo "Copying web assets directly to native iOS bundle..."
          mkdir -p ios/App/App/public
          cp -r public/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json
          npx cap copy ios || true

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -clonedSourcePackagesDirPath SourcePackages

      - name: Build Xcode Release Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual

      - name: Package App into .IPA File
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr CineLocket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLocket-iOS-IPA-120Hz
          path: build/CineLocket.ipa
          retention-days: 14

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ios
          name: "CineLocket iOS (120Hz ProMotion) v1.0.0"
          body: |
            ## 📱 CineLocket iOS App (120Hz ProMotion & Mobile Optimized)
            - 🚀 **120Hz ProMotion**: Mở khóa tần số quét cao trên iPhone 13 Pro / 14 Pro / 15 Pro / 16 Pro.
            - ⚡ **Cảm ứng mượt mà**: Không độ trễ 300ms với `touch-action: manipulation`.
            - 📱 **Tương thích toàn màn hình**: Hỗ trợ Dynamic Island và tai thỏ.
            - 📷 **Quyền Camera & Thư viện**: Cho phép chụp ảnh và đăng tải video trực tiếp lên Locket.

            ### 📥 Tải file trực tiếp:
            Bấm vào liên kết **CineLocket.ipa** bên dưới để tải về máy mà không cần đăng nhập tài khoản GitHub.
          files: build/CineLocket.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
