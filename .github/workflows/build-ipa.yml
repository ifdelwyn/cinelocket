name: Build CineLocket iOS IPA (120Hz Mobile Optimized)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Initialize Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Configure iOS Permissions & 120Hz ProMotion Optimization
        run: |
          PLIST="ios/App/App/Info.plist"

          # 1. Unlock 120Hz ProMotion High-Refresh Rate on iPhone & iPad Pro
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDuration bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDuration true" "$PLIST"

          # 2. Native Camera & Photo Library Permissions
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CineLocket cần quyền truy cập camera để chụp ảnh và quay video đăng lên Locket.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CineLocket cần quyền truy cập thư viện để chọn ảnh và video đăng tải lên Locket.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'CineLocket cần quyền lưu ảnh và video về thiết bị.'" "$PLIST" || true

          # 3. Mobile Display & Fullscreen Optimization
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into .IPA File
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr CineLocket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLocket-iOS-IPA-120Hz
          path: build/CineLocket.ipa
          retention-days: 14
