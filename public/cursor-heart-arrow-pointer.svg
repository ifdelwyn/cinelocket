<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38" fill="none">
  <defs>
    <filter id="pointerGlow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FF2E88" flood-opacity="0.75"/>
      <feDropShadow dx="0.8" dy="1.5" stdDeviation="1.2" flood-color="#1A0410" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="pointerHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF80B8"/>
      <stop offset="40%" stop-color="#FF2E88"/>
      <stop offset="100%" stop-color="#D6106B"/>
    </linearGradient>
    <linearGradient id="pointerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>

  <g filter="url(#pointerGlow)">
    <!-- Shaft and Tail -->
    <line x1="2" y1="2" x2="34" y2="34" stroke="#2B0515" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M27 32 L34 34 L32 27 L29 28 L26 30 Z" fill="#FF80B8" stroke="#2B0515" stroke-width="0.8" stroke-linejoin="round"/>
    <line x1="2" y1="2" x2="34" y2="34" stroke="url(#pointerGold)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pulsing Heart -->
    <path d="M19.5 29 C13.8 24.2 8.2 19.2 8.2 13.2 C8.2 9.2 11.2 6.5 14.8 6.5 C17.2 6.5 18.8 7.7 19.5 9.1 C20.2 7.7 21.8 6.5 24.2 6.5 C27.8 6.5 30.8 9.2 30.8 13.2 C30.8 19.2 25.2 24.2 19.5 29 Z" 
          fill="url(#pointerHeart)" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Sparkle Stars -->
    <path d="M10 6 L11 9 L14 10 L11 11 L10 14 L9 11 L6 10 L9 9 Z" fill="#FFF4D0" stroke="#FFFFFF" stroke-width="0.5"/>
    <path d="M29 5 L29.8 7.2 L32 8 L29.8 8.8 L29 11 L28.2 8.8 L26 8 L28.2 7.2 Z" fill="#FFF4D0" stroke="#FFFFFF" stroke-width="0.5"/>

    <!-- Piercing Shaft Overlay -->
    <line x1="13" y1="13" x2="18" y2="18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="13" y1="13" x2="18" y2="18" stroke="url(#pointerGold)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Arrowhead Tip (2,2) -->
    <polygon points="2,2 12,4.5 8,8 4.5,12" fill="#2B0515"/>
    <polygon points="2.5,2.5 11,4.8 7.7,7.7 4.8,11" fill="url(#pointerGold)" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="3.2" cy="3.2" r="1" fill="#FFFFFF"/>
  </g>
</svg>